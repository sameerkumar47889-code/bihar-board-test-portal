<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बिहार बोर्ड परीक्षा पोर्टल</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #b71c1c;
            text-align: center;
            border-bottom: 2px solid #b71c1c;
            padding-bottom: 10px;
        }
        .status-box {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .question {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            background-color: #f0f0f0;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options li:hover {
            background-color: #e0e0e0;
        }
        button {
            display: block;
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>बिहार बोर्ड ऑनलाइन टेस्ट पोर्टल</h1>
    
    <!-- डेमो सूचना बॉक्स -->
    <div class="status-box">
        ⚠️ महत्वपूर्ण: यह प्रारंभिक डेमो है। अभी केंद्रीय डेटाबेस और शिक्षक लॉगिन की सुविधा सक्रिय नहीं है। आपके अंक केवल इसी ब्राउज़र सत्र में दिखाई देंगे।
    </div>

    <div class="quiz-area">
        <div class="question">प्रश्न 1: बिहार की राजधानी कहाँ है?</div>
        <ul class="options">
            <li><input type="radio" name="q1" id="o1"> <label for="o1">पटना</label></li>
            <li><input type="radio" name="q1" id="o2"> <label for="o2">गया</label></li>
            <li><input type="radio" name="q1" id="o3"> <label for="o3">भागलपुर</label></li>
            <li><input type="radio" name="q1" id="o4"> <label for="o4">मुजफ्फरपुर</label></li>
        </ul>
    </div>

    <button onclick="alert('डेमो में उत्तर सबमिट करने के लिए धन्यवाद! जल्द ही स्कोर ट्रैकिंग जोड़ी जाएगी।')">उत्तर सबमिट करें</button>
</div>

</body>
  </html>
